              bulkMsg.textContent = r.error;
              return;
            }
            b.items.push(...r.items.map((x) => ({ id: newId(), ...x })));
            refresh();
            const again = $("blockEditor").querySelector("input.bulk");
            if (again) again.focus();
          };
          bulk.addEventListener("keydown", (e) => {
            if (e.key === "Enter") addItems();
          });
          parts.push(
            el(
              "div",
              { class: "row" },
              bulk,
              el("button", { onclick: addItems }, "Add items"),
            ),
            bulkMsg,
          );
        } else {
          const row = el(
            "div",
            { class: "row" },
            el(
              "label",
              {},
              "Width ",
              el("input", {
                type: "number",
                min: 1,
                max: 64,
                class: "narrow",
                value: b.width,
                oninput: (e) => {
                  b.width = e.target.value;
                  refresh("blockEditor");
                },
              }),
              " bits",
            ),
          );
          if (b.kind === "number") {
            row.append(
              el(
                "label",
                {},
                "Interpretation ",
                el(
                  "select",
                  {
                    onchange: (e) => {
                      b.numberMode = e.target.value;
                      b.signed = b.numberMode === "signed";
                      refresh();
                    },
                  },
                  ...NUMBER_MODES.map((mode) =>
                    el("option", { value: mode, selected: b.numberMode === mode }, mode),
                  ),
                ),
              ),
              el("span", { class: "small muted" },
                "Raw displays bits in binary (up to 8 bits) or hexadecimal."),
            );
          } else if (b.kind === "const") {
            row.append(
              el(
                "label",
                {},
                "Value ",
                el("input", {
                  class: "code",
                  value: b.value,
                  placeholder: "%01",
                  oninput: (e) => {
                    b.value = e.target.value;
                    refresh("blockEditor");
                  },
                }),
              ),
            );
          } else {
            row.append(
              el("span", { class: "small muted" }, "Always encoded as zero."),
            );
          }
          parts.push(row);
        }
        box.replaceChildren(...parts);
      }

      function renderBlockInfo(ctx) {
        const box = $("blockInfo");
        const b = currentBlock();
        if (!b) {
          box.replaceChildren();
          return;
        }
        const info = ctx.infos.get(b.id);
        const used = ctx.usage.get(b.id) || 0;
        let width =
          info.width === null
            ? "Width: unknown."
            : `Width: ${plural(info.width, "bit")}`;
        if (b.kind === "list" && info.width !== null)
          width +=
            info.width === info.auto ? " (auto)." : ` (${info.auto} needed).`;
        else if (info.width !== null) width += ".";
        const uses = state.mnemonics.flatMap((m) => {
          const slots = m.slots
            .map((slot, index) => ({ slot, index }))
            .filter(({ slot }) => slot.blockId === b.id);
          if (!slots.length) return [];
          const layout = ctx.layouts.get(m.id);
          return [
            el(
              "li",
              {},
              el(
                "button",
                {
                  type: "button",
                  onclick: () => {
                    state.selectedMnemonic = m.id;
                    refresh();
                    $("mnemonicList").scrollIntoView({ block: "nearest" });
                  },
                },
                mnemonicDisplayName(m),
              ),
              ...slots.map(({ slot, index }) => {
                const placed = layout.ok
                  ? layout.placed.find((p) => p.slot.id === slot.id)
                  : null;
                const label = placed?.label || slot.label.trim() || b.name || "(unnamed)";
                return el(
                  "span",
                  { class: "small" },
                  `Slot ${index + 1}: ${label} · ${placed ? `bits ${bitRange(placed)}` : "position unavailable"}`,
                );
              }),
            ),
          ];
        });
        box.replaceChildren(...[
          el(
            "p",
            { class: "small" },
            `${width} Used in ${plural(used, "mnemonic slot")}.`,
          ),
          uses.length
            ? el("div", { class: "block-usage" }, el("h3", {}, "Used by"), el("ul", {}, ...uses))
            : null,
          messageList(info.errors, "error") || "",
          messageList(info.warnings, "warning") || "",
        ].filter(Boolean));
        if (b.kind === "list") {
          const rows = $("blockEditor").querySelectorAll(
            "table.items tbody tr",
          );
          b.items.forEach((it, i) => {
            const cell = rows[i] && rows[i].cells[3].firstElementChild;
            if (cell) {
              const value =
                info.codes.has(it.id) && info.width !== null
                  ? "%" + bin(info.codes.get(it.id), info.width)
                  : "—";
              cell.textContent = value;
              cell.title = value;
            }
          });
        }
      }

      function renderMnemonicList(ctx) {
        const groups = [...new Map(
          state.mnemonics.map((m) => [mnemonicGroupId(m), m]),
        ).values()];
        $("mnemonicList").replaceChildren(
          ...groups.map((representative) => {
            const forms = mnemonicForms(representative);
            const m = forms.find((form) => form.id === state.selectedMnemonic) || forms[0];
            const btn = el(
              "button",
              {
                class:
                  "mn" + (m.id === state.selectedMnemonic ? " selected" : ""),
                title: "Click to edit. You can also drop a block here.",
                onclick: () => {
                  state.selectedMnemonic = m.id;
                  refresh();
                },
                ondragover: (e) => {
                  if (dragData && (dragData.type === "block" || dragData.type === "padding")) {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = "copy";
                    btn.classList.add("over");
                  }
                },
                ondragleave: () => btn.classList.remove("over"),
                ondrop: (e) => {
                  e.preventDefault();
                  const d = dragData;
                  endDrag();
                  if (d && (d.type === "block" || d.type === "padding")) {
                    state.selectedMnemonic = m.id;
                    if (d.type === "padding") addPaddingSlot(m, m.slots.length);
                    else addSlot(m, d.id, m.slots.length);
                  }
                },
              },
              m.name || "(unnamed)",
              forms.every((form) => ctx.layouts.get(form.id).valid)
                ? null : el("span", { class: "error" }, " ⚠"),
            );
            return el("li", {}, btn);
          }),
        );
      }

      function renderMnemonicEditor(ctx) {
        const box = $("mnemonicEditor");
        const m = currentMnemonic();
        if (!m) {
          box.replaceChildren(
            el("p", { class: "muted" }, "Select or add a mnemonic."),
          );
          return;
        }
        const slotLabels = new Map(
          ctx.layouts.get(m.id).placed.map((p) => [p.slot.id, p.label]),
        );
        const zone = el("div", { id: "slotZone" });
        const chips = m.slots.map((sl, i) => {
          const b = blockById(sl.blockId);
          const info = b && ctx.infos.get(b.id);
          const slotLabel =
            b?.kind === "padding"
              ? slotLabels.get(sl.id) || `${m.name.trim() || "(unnamed)"}/RESERVED`
              : sl.label;
          const chip = el("div", {
            class: "chip",
            bg: b ? b.color : "#eeeeee",
          });
          const handle = el(
            "span",
            {
              class: "handle",
              draggable: true,
              title: "Drag to move",
              ondragstart: (e) => {
                startDrag(
                  e,
                  { type: "slot", mnemonic: m.id, index: i },
                  "move",
                );
                e.dataTransfer.setDragImage(chip, 10, 10);
              },
              ondragend: endDrag,
            },
            "⠿",
          );
          chip.append(
            handle,
            el("input", {
              class:
                b?.kind === "padding" ? "slabel autoPaddingName" : "slabel",
              value: slotLabel,
              readOnly: b?.kind === "padding",
              placeholder: b ? b.name : "?",
              title: b?.kind === "padding"
                ? "Padding name is generated from the mnemonic and bit position."
                : "Slot name, e.g. Rn",
              oninput: (e) => {
                sl.label = e.target.value;
                refresh("mnemonicEditor");
              },
            }),
            b?.kind === "padding"
              ? el("label", { class: "small padding-width" }, "Width ",
                  el("input", {
                    type: "number",
                    min: 1,
                    max: 64,
                    class: "narrow",
                    value: b.width,
                    ariaLabel: `Padding width for slot ${i + 1}`,
                    oninput: (e) => setPaddingWidth(sl, e.target.value),
                  }),
                  " bits")
              : el("span", { class: "small" },
                  b ? `${b.name} · ${info.width === null ? "?" : info.width} bits` : "deleted block"),
          );
          if (b && b.kind === "list") {
            const selectedItem = defaultListItem(sl, b);
            const pin = el(
              "select",
              {
                title: "Select the list value for this mnemonic.",
                onchange: (e) => {
                  sl.pin = Number(e.target.value);
                  refresh();
                },
              },
              ...(selectedItem
                ? []
                : [el("option", { value: "", disabled: true }, "No items")]),
              ...b.items.map((it) =>
                el("option", { value: String(it.id) }, `= ${it.name || "?"}`),
              ),
            );
            pin.value = String(selectedItem?.id ?? "");
            chip.append(pin);
          }
          chip.append(
            el(
              "button",
              {
                class: "mini",
                title: "Move left",
                disabled: i === 0,
                onclick: () => moveSlot(m, i, i - 1),
              },
              "←",
            ),
            el(
              "button",
              {
                class: "mini",
                title: "Move right",
                disabled: i === m.slots.length - 1,
                onclick: () => moveSlot(m, i, i + 2),
              },
              "→",
            ),
            el(
              "button",
              {
                class: "mini",
                title: "Remove slot",
                onclick: () => {
                  m.slots.splice(i, 1);
                  for (const variant of m.comparisons) delete variant.values[sl.id];
                  pruneGeneratedPadding();
                  refresh();
                },
              },
              "✕",
            ),
          );
          return chip;
        });
        zone.append(
          ...(chips.length
            ? chips
            : [
                el(
                  "span",
                  { class: "muted" },
                  "Drop blocks here. The first slot takes the most significant bits.",
                ),
              ]),
        );
        zone.addEventListener("dragover", (e) => {
          if (
            !dragData ||
            (dragData.type === "slot" && dragData.mnemonic !== m.id)
          )
            return;
          e.preventDefault();
          e.dataTransfer.dropEffect =
            dragData.type === "block" || dragData.type === "padding" ? "copy" : "move";
          clearDropMarks();
          zone.classList.add("over");
          const idx = dropIndex(zone, e);
          const target = zone.querySelectorAll(".chip")[idx];
          if (target) target.classList.add("drop-before");
          else zone.classList.add("drop-end");
        });
        zone.addEventListener("dragleave", (e) => {
          if (!zone.contains(e.relatedTarget)) clearDropMarks();
        });
        zone.addEventListener("drop", (e) => {
          e.preventDefault();
          const d = dragData;
          const idx = dropIndex(zone, e);
          endDrag();
          if (!d) return;
          if (d.type === "padding") addPaddingSlot(m, idx);
          else if (d.type === "block") addSlot(m, d.id, idx);
          else if (d.mnemonic === m.id) moveSlot(m, d.index, idx);
        });
        box.replaceChildren(
          el(
            "div",
            { class: "row" },
            el(
              "label",
              {},
              "Name ",
              el("input", {
                value: m.name,
                placeholder: "e.g. OP.mem",
                oninput: (e) => {
                  setMnemonicName(m, e.target.value);
                  refresh("mnemonicEditor");
                },
              }),
            ),
            el("button", { onclick: () => duplicateMnemonic(m) }, "Duplicate"),
            el("button", { onclick: () => deleteMnemonic(m) }, "Delete"),
          ),
          el(
            "div",
            { class: "row" },
            el("strong", {}, "Forms"),
            ...mnemonicForms(m).map((form) =>
              el(
                "button",
                {
                  class: "mn" + (form.id === m.id ? " selected" : ""),
                  onclick: () => {
                    state.selectedMnemonic = form.id;
                    refresh();
                  },
                },
                formName(form),
              ),
            ),
            el("button", {
              class: "mini",
              title: "Add form",
              ariaLabel: "Add form",
              onclick: () => addMnemonicForm(m),
            }, "+"),
            mnemonicForms(m).length > 1
              ? el("button", {
                  class: "mini",
                  title: "Remove current form",
                  ariaLabel: "Remove current form",
                  onclick: () => deleteMnemonicForm(m),
                }, "−")
              : null,
          ),
          ...(mnemonicForms(m).length > 1
            ? [el(
                "div",
                { class: "row" },
                el("label", {}, "Form name ", el("input", {
                  value: m.formName,
                  placeholder: formName(m),
                  oninput: (e) => {
                    m.formName = e.target.value;
                    refresh("mnemonicEditor");
                  },
                  onchange: () => refresh(),
                })),
              )]
            : []),
          el(
            "div",
            { class: "row" },
            ...[
              ["Addressing mode", "addressing", "e.g. immediate, indexed"],
              ["Bytes", "bytes", "e.g. 2"],
              ["Cycles", "cycles", "e.g. 2 (3 if page crossed)"],
              ["Flags", "flags", "e.g. N Z C V"],
            ].map(([label, key, placeholder]) =>
              el(
                "label",
                {},
                label,
                " ",
                el("input", {
                  value: m[key],
                  placeholder,
                  oninput: (e) => {
                    m[key] = e.target.value;
                    refresh("mnemonicEditor");
                  },
                }),
              ),
            ),
          ),
          el(
            "label",
            {},
            "Operation",
            el("textarea", {
              class: "docOperation",
              rows: 1,
              value: m.operation,
              placeholder: "e.g. Rn = Ra + Rb",
              oninput: (e) => {
                m.operation = e.target.value;
                refresh("mnemonicEditor");
              },
            }),
          ),
          el(
            "label",
            {},
            "Description",
            el("textarea", {
              class: "docDescription",
              value: m.description,
              placeholder: "Describe the instruction behavior or notes.",
              oninput: (e) => {
                m.description = e.target.value;
                refresh("mnemonicEditor");
              },
            }),
          ),
          zone,
        );
      }

      function renderMnemonicInfo(ctx) {
        const box = $("mnemonicInfo");
        const m = currentMnemonic();
        if (!m) {
          box.replaceChildren();
          return;
        }
        box.replaceChildren(
          ...mnemonicForms(m).map((form) => {
            const lay = ctx.layouts.get(form.id);
            return el(
              "section",
              {},
              el("h3", {}, formName(form)),
              messageList(lay.errors, "error"),
              messageList(lay.warnings, "warning"),
              renderDiagram(lay, null),
              lay.ok && lay.placed.length
                ? el(
                    "p",
                    { class: "small" },
                    "Decode pattern (x = variable bit): ",
                    el("code", {}, patternText(lay)),
                  )
                : null,
            );
          }),
        );
        alignDiagrams(box);
      }

      function updatePaddingSlotLabels(ctx) {
        const m = currentMnemonic();
        if (!m) return;
        const inputs = $("mnemonicEditor").querySelectorAll("input.slabel");
        m.slots.forEach((slot, index) => {
          const block = blockById(slot.blockId);
          if (block?.kind !== "padding") return;
          const placed = ctx.layouts.get(m.id).placed.find(
            (p) => p.slot.id === slot.id,
          );
          inputs[index].value =
            placed?.label || `${m.name.trim() || "(unnamed)"}/RESERVED`;
        });
      }

      function renderEncInputs(ctx) {
        const box = $("encInputs");
        const m = currentEncodeMnemonic();
        const selector = el(
          "label",
          { class: "encField" },
          el("span", {}, "Mnemonic to encode"),
          el(
            "select",
            {
              value: String(state.selectedEncodeMnemonic ?? ""),
              onchange: (e) => {
                state.selectedEncodeMnemonic = Number(e.target.value);
                refresh();
              },
            },
            ...state.mnemonics.map((mnemonic) =>
              el("option", {
                value: String(mnemonic.id),
                selected: mnemonic.id === state.selectedEncodeMnemonic,
              }, mnemonicDisplayName(mnemonic)),
            ),
          ),
        );
        if (!m) {
          box.replaceChildren(
            selector,
            el("p", { class: "muted" }, "Add a mnemonic to encode."),
          );
          return;
        }
        const lay = ctx.layouts.get(m.id);
        const variants = [
          { assemblyLine: m.assemblyLine, values: null, main: true },
          ...m.comparisons.map((variant) => ({ ...variant, main: false })),
        ];
        const groups = variants.map((variant, index) => {
          const setAssemblyLine = (value) => {
            if (variant.main) m.assemblyLine = value;
            else m.comparisons[index - 1].assemblyLine = value;
            renderEncOutput(computeAll());
            save();
          };
          const setValue = (slot, value) => {
            if (variant.main) slot.encValue = value;
            else variant.values[slot.id] = value;
            refresh("encInputs");
          };
          const reference = el(
            "div",
            { class: "encReferenceRow" },
            el(
              "label",
              { class: "encReference" },
              "Assembly line (reference only; not parsed)",
              el("input", {
                type: "text",
                value: variant.assemblyLine,
                placeholder: "",
                oninput: (e) => setAssemblyLine(e.target.value),
              }),
            ),
            el(
              "button",
              {
                class: "mini",
                title: variant.main ? "Add comparison" : "Remove comparison",
                "aria-label": variant.main
                  ? "Add comparison"
                  : `Remove encoding ${index + 1}`,
                onclick: () => {
                  if (variant.main) {
                    m.comparisons.push({
                      assemblyLine: "",
                      values: Object.fromEntries(
                        m.slots.map((slot) => {
                          const block = blockById(slot.blockId);
                          const fallback = block?.kind === "list"
                            ? defaultListItem(slot, block)
                            : null;
                          return [slot.id, slot.encValue || (fallback ? String(fallback.id) : "")];
                        }),
                      ),
                    });
                  } else {
                    m.comparisons.splice(index - 1, 1);
                  }
                  refresh();
                },
              },
              variant.main ? "+" : "−",
            ),
          );
          const controls = lay.valid
            ? lay.placed.map((p) => {
                const b = p.block;
                const sl = p.slot;
                const value = variant.values?.[sl.id] ?? sl.encValue;
                let control;
                if (b.kind === "const")
                  control = el("input", {
                    value: codeText(p.info.value, p.w),
                    disabled: true,
                  });
                else if (b.kind === "padding")
                  control = el("input", { value: "0", disabled: true });
                else if (b.kind === "list") {
                  const selected = value === ""
                    ? defaultListItem(sl, b)
                    : b.items.find((it) => String(it.id) === value);
                  control = el(
                    "select",
                    {
                      onchange: (e) => setValue(sl, e.target.value),
                    },
                    ...(selected
                      ? []
                      : [el("option", { value: "", disabled: true }, "Selected item unavailable")]),
                    ...b.items.map((it) =>
                      el("option", { value: String(it.id) }, it.name || "?"),
                    ),
                  );
                  control.value = String(selected?.id ?? "");
                } else {
                  control = el("input", {
                    value,
                    placeholder: "0",
                    oninput: (e) => setValue(sl, e.target.value),
                  });
                }
                return el(
                  "label",
                  { class: "encField" },
                  el(
                    "span",
                    {},
                    b.kind === "padding"
                      ? `${p.label} (${p.w} bits)`
                      : `${p.label} (${b.name}, ${p.w} bits)`,
                  ),
                  control,
                );
              })
            : [
                el(
                  "p",
                  { class: "muted" },
                  lay.errors.length
                    ? "Fix the selected mnemonic's errors first."
                    : "Add slots to the mnemonic first.",
                ),
              ];
          return el(
            "div",
            { class: "encVariant" },
            el("strong", {}, `Encoding ${index + 1}`),
            reference,
            ...controls,
          );
        });
        box.replaceChildren(selector, ...groups);
      }

      function renderEncOutput(ctx) {
        const box = $("encOutput");
        const m = currentEncodeMnemonic();
        if (!m) {
          box.replaceChildren();
          return;
        }
        const lay = ctx.layouts.get(m.id);
        if (!lay.valid) {
          box.replaceChildren(
            el(
              "p",
              { class: "muted" },
              lay.errors.length
                ? "Fix the selected mnemonic's errors first."
                : "Add slots to the mnemonic first.",
            ),
          );
          return;
        }
        const variants = [
          { assemblyLine: m.assemblyLine, values: null },
          ...m.comparisons,
        ];
        const results = variants.map((variant, index) => {
          const variantLayout = mnemonicLayout(
            {
              ...m,
              slots: m.slots.map((slot) => {
                const value = variant.values?.[slot.id] ?? slot.encValue;
                const block = blockById(slot.blockId);
                const item = block?.kind === "list"
                  ? block.items.find((entry) => String(entry.id) === value)
                  : null;
                return item ? { ...slot, pin: item.id } : slot;
              }),
            },
            ctx.infos,
            ctx.W,
          );
          const { word, errors } = encodeWord(variantLayout, variant.values);
          if (errors.length)
            return {
              word: null,
              view: el(
                "div",
                { class: "encVariant" },
                el("strong", {}, `Encoding ${index + 1}`),
                messageList(errors, "error"),
              ),
            };
          const hexText = hex(word, lay.width);
          return {
            word,
            view: el(
              "div",
              { class: "encVariant" },
              el("strong", {}, `Encoding ${index + 1}`),
              ...(variant.assemblyLine.trim()
                ? [
                    el(
                      "div",
                      {},
                      "Assembly line: ",
                      el("code", {}, variant.assemblyLine),
                    ),
                  ]
                : []),
              el("div", {}, el("code", {}, asmText(m, variantLayout, word))),
              el(
                "div",
                {},
                "Hex: ",
                el("code", {}, hexText),
                " ",
                el(
                  "button",
                  {
                    class: "mini",
                    onclick: () => copyText(hexText),
                  },
                  "Copy",
                ),
              ),
              el(
                "div",
                {},
                "Binary: ",
                el(
                  "code",
                  {},
                  variantLayout.segments
                    .map((s) => bin(segBits(word, s), s.w))
                    .join(" "),
                ),
              ),
              renderDiagram(variantLayout, word),
            ),
          };
        });
        const comparisons = results.slice(1).map((result, index) => {
          if (result.word === null) return null;
          const matching = results
            .slice(0, index + 1)
            .findIndex((previous) => previous.word === result.word);
          return el(
            "p",
            { class: "small" },
            matching >= 0
              ? `Encoding ${index + 2} matches Encoding ${matching + 1}.`
              : `Encoding ${index + 2} does not match the previous encodings.`,
          );
        });
        box.replaceChildren(...results.map((result) => result.view), ...comparisons.filter(Boolean));
      }

      function renderDecode(ctx) {
        const box = $("decOutput");
        const word = parseWord($("decInput").value);
        if (word === null) {
          box.replaceChildren(
            el("p", { class: "muted" }, "Enter a word to decode."),
          );
          return;
        }
        if (word === undefined) {
          box.replaceChildren(
            el(
              "p",
              { class: "error" },
              "Not a valid number. Use $…, 0x…, %…, 0b… or hex digits.",
            ),
          );
          return;
        }
        if (ctx.W === null) {
          box.replaceChildren(
            el("p", { class: "error" }, "Set a valid word width first."),
          );
          return;
        }
        if (word > maskOf(ctx.W)) {
          box.replaceChildren(
            el(
              "p",
              { class: "error" },
              `The word is wider than ${ctx.W} bits.`,
            ),
          );
          return;
        }
        const valid = state.mnemonics.filter(
          (m) => ctx.layouts.get(m.id).valid,
        );
        const skipped = state.mnemonics.length - valid.length;
        const matches = valid.filter((m) => {
          const l = ctx.layouts.get(m.id);
          return (word & l.fixedMask) === l.fixedValue;
        });
        const parts = [];
        if (matches.length > 1)
          parts.push(
            el(
              "p",
              { class: "warning" },
              `Ambiguous: ${matches.length} mnemonics match this word.`,
            ),
          );
        for (const m of matches) {
          const lay = ctx.layouts.get(m.id);
          const unknown = lay.placed.filter(
            (p) =>
              p.block.kind === "list" &&
              !p.fixed &&
              !itemForCode(p, segBits(word, p)),
          );
          parts.push(
            el("h3", {}, mnemonicDisplayName(m)),
            el("div", {}, el("code", {}, asmText(m, lay, word))),
            messageList(
              unknown.map(
                (p) =>
                  `${p.label}: code ${codeText(segBits(word, p), p.w)} is not an item of "${p.block.name}".`,
              ),
              "warning",
            ),
            renderDiagram(lay, word),
          );
        }
        if (!matches.length)
          parts.push(
            el("p", { class: "muted" }, "No mnemonic matches this word."),
          );
        if (skipped)
          parts.push(
            el(
              "p",
              { class: "muted small" },
              `${plural(skipped, "mnemonic")} with errors or without slots were skipped.`,
            ),
          );
        box.replaceChildren(...parts.filter(Boolean));
      }

      function renderCheck(ctx) {
        const errors = [];
        const warnings = [];
        for (const b of state.blocks) {
          const info = ctx.infos.get(b.id);
          if (info.errors.length)
            errors.push(
              `Block "${b.name || "(unnamed)"}": ${info.errors.join(" ")}`,
            );
        }
        for (const m of state.mnemonics) {
          const lay = ctx.layouts.get(m.id);
          if (lay.errors.length)
            errors.push(
              `Mnemonic "${mnemonicDisplayName(m)}": ${lay.errors.join(" ")}`,
            );
          else if (!lay.placed.length)
            warnings.push(`Mnemonic "${mnemonicDisplayName(m)}" has no slots.`);
        }
        const valid = state.mnemonics.filter(
          (m) => ctx.layouts.get(m.id).valid,
        );
        for (let i = 0; i < valid.length; i++) {
          for (let j = i + 1; j < valid.length; j++) {
            const a = ctx.layouts.get(valid[i].id);
            const b = ctx.layouts.get(valid[j].id);
            const common = a.fixedMask & b.fixedMask;
            if (((a.fixedValue ^ b.fixedValue) & common) === 0n) {
              warnings.push(
                `"${mnemonicDisplayName(valid[i])}" and "${mnemonicDisplayName(valid[j])}" can produce the same word: no fixed bit tells them apart.`,
              );
            }
          }
        }
        const summary = el(
          "p",
          { class: "small" },
          `${plural(state.blocks.length, "block")}, ${plural(new Set(state.mnemonics.map(mnemonicGroupId)).size, "mnemonic")}.`,
        );
        const ok =
          !errors.length && !warnings.length
            ? el("p", {}, "No problems found.")
            : null;
        $("checkOutput").replaceChildren(
          ...[
            summary,
            ok,
            messageList(errors, "error"),
            messageList(warnings, "warning"),
          ].filter(Boolean),
        );
      }

      function refresh(skip) {
        const ctx = computeAll();
        renderPalette(ctx);
        if (skip !== "blockEditor") renderBlockEditor(ctx);
        renderBlockInfo(ctx);
        renderMnemonicList(ctx);
        if (skip !== "mnemonicEditor") renderMnemonicEditor(ctx);
        else updatePaddingSlotLabels(ctx);
        renderMnemonicInfo(ctx);
        if (skip !== "encInputs") renderEncInputs(ctx);
        renderEncOutput(ctx);
        renderDecode(ctx);
        renderCheck(ctx);
        save();
      }

      // ---------- Markdown ----------

      const mdCell = (s) => String(s).replace(/\|/g, "\\|");

      function generateMarkdown(ctx) {
        const out = [
          `# ${state.docTitle || "Instruction Set Reference"}`,
          "",
        ];
        if (state.docIntro) out.push(state.docIntro, "");
        out.push(
          "## Instruction encoding",
          "",
          `Word width: ${ctx.W === null ? "?" : ctx.W} bits.`,
          "",
          "### Building blocks",
          "",
        );
        for (const b of state.blocks) {
          if (b.kind === "padding") continue;
          const info = ctx.infos.get(b.id);
          out.push(
            `#### ${b.name || "(unnamed)"} (${KIND_LABEL[b.kind]}, ${blockSummary(b, info)})`,
            "",
          );
          if (info.errors.length)
            out.push(...info.errors.map((e) => `- Error: ${e}`), "");
          if (b.kind === "list" && b.items.length) {
            out.push("| Code | Item |", "| ---- | ---- |");
            for (const it of b.items) {
              const code =
                info.codes.has(it.id) && info.width !== null
                  ? "%" + bin(info.codes.get(it.id), info.width)
                  : "?";
              out.push(`| ${code} | ${mdCell(it.name || "?")} |`);
            }
            out.push("");
          }
        }
        out.push("### Mnemonics", "");
        for (const m of state.mnemonics) {
          const lay = ctx.layouts.get(m.id);
          out.push(`#### ${mnemonicDisplayName(m)}`, "");
          for (const [label, value] of [
            ["Addressing mode", m.addressing],
            ["Operation", m.operation],
            ["Bytes", m.bytes],
            ["Cycles", m.cycles],
            ["Flags", m.flags],
          ])
            if (value) {
              const text = mdCell(value);
              out.push(`- ${label}: ${label === "Operation" ? text.replace(/\n/g, "  \n  ") : text}`);
            }
          if (m.description) out.push("", mdCell(m.description));
          if ([m.addressing, m.operation, m.bytes, m.cycles, m.flags, m.description].some(Boolean))
            out.push("");
          if (lay.errors.length) {
            out.push(...lay.errors.map((e) => `- Error: ${e}`), "");
            continue;
          }
          if (!lay.placed.length) {
            out.push("No slots.", "");
            continue;
          }
          out.push(
            "```",
            lay.segments
              .map((s) =>
                (s.free ? "unused" : s.block.kind === "padding"
                  ? reservedLabel(s.hi, s.lo) : s.label) + `(${s.w})`)
              .join(" "),
            "```",
            "",
          );
          out.push(
            "| Bits | Slot | Block | Value |",
            "| ---- | ---- | ----- | ----- |",
          );
          for (const s of lay.segments) {
            if (s.free) {
              out.push(`| ${bitRange(s)} | — | unused | 0 |`);
              continue;
            }
            let value = "";
            if (s.block.kind === "const") value = codeText(s.info.value, s.w);
            else if (s.block.kind === "padding") value = "0";
            else if (s.block.kind === "list") value = listDefaultText(s);
            const label = s.block.kind === "padding"
              ? reservedLabel(s.hi, s.lo) : s.label;
            const blockName = s.block.kind === "padding" ? label : s.block.name;
            out.push(
              `| ${bitRange(s)} | ${mdCell(label)} | ${mdCell(blockName)} | ${mdCell(value)} |`,
            );
          }
          out.push("");
        }
        return out.join("\n");
      }

      const htmlText = (value) =>
        String(value ?? "").replace(/[&<>\"']/g, (c) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '\"': "&quot;",
          "'": "&#39;",
        })[c]);

      function generatePrintHtml(ctx) {
        const title = htmlText(state.docTitle || "Instruction Set Reference");
        const intro = state.docIntro
          ? `<p class="document-intro">${htmlText(state.docIntro)}</p>`
          : "";
        const instructionRows = state.mnemonics.map((m) => {
          const lay = ctx.layouts.get(m.id);
          const pattern = lay.valid ? patternText(lay) : "Invalid layout";
          return `<tr><td>${htmlText(mnemonicDisplayName(m))}</td><td>${htmlText(m.addressing)}</td><td>${htmlText(m.bytes)}</td><td>${htmlText(m.cycles)}</td><td>${htmlText(m.flags)}</td><td><code>${htmlText(pattern)}</code></td></tr>`;
        }).join("");
        const instructionDetails = state.mnemonics.map((m) => {
          const lay = ctx.layouts.get(m.id);
          const pattern = lay.valid ? patternText(lay) : lay.errors.join(" ");
          const fields = lay.valid ? lay.placed.map((p) => {
            let meaning = KIND_LABEL[p.block.kind];
            if (p.block.kind === "const") meaning = `constant ${codeText(p.info.value, p.w)}`;
            else if (p.block.kind === "padding") meaning = "zero padding";
            else if (p.block.kind === "list") meaning = listDefaultText(p);
            else if (p.block.kind === "number")
              meaning = `${p.block.numberMode === "raw" ? "raw " : p.block.signed ? "signed " : ""}immediate`;
            const blockName =
              p.block.kind === "padding" ? p.label : p.block.name;
            return `<tr><td>${htmlText(p.label)}</td><td>${htmlText(blockName)}</td><td>${htmlText(bitRange(p))}</td><td>${p.w}</td><td>${htmlText(meaning)}</td></tr>`;
          }).join("") : "";
          const metadata = [
            ["Addressing mode", m.addressing],
            ["Operation", m.operation],
            ["Bytes", m.bytes],
            ["Cycles", m.cycles],
            ["Flags", m.flags],
          ].filter(([, value]) => value).map(([label, value]) =>
            `<span${label === "Operation" ? ' class="operation"' : ""}><b>${label}:</b> ${htmlText(value)}</span>`
          ).join("");
          return `<article><h2>${htmlText(mnemonicDisplayName(m))}</h2><div class="meta">${metadata}</div>${m.description ? `<p class="description">${htmlText(m.description)}</p>` : ""}<p><b>Decode pattern:</b> <code>${htmlText(pattern)}</code></p>${fields ? `<table><thead><tr><th>Field</th><th>Block</th><th>Position</th><th>Bits</th><th>Meaning</th></tr></thead><tbody>${fields}</tbody></table>` : ""}</article>`;
        }).join("");
        const lists = state.blocks.filter((b) => b.kind === "list").map((b) => {
          const info = ctx.infos.get(b.id);
          const rows = b.items.map((item) => {
            const code = info.codes.has(item.id) && info.width !== null
              ? "%" + bin(info.codes.get(item.id), info.width)
              : "?";
            return `<tr><td><code>${code}</code></td><td>${htmlText(item.name || "?")}</td></tr>`;
          }).join("");
          return `<article><h3>${htmlText(b.name || "(unnamed)")}</h3><table><thead><tr><th>Code</th><th>Value</th></tr></thead><tbody>${rows}</tbody></table></article>`;
        }).join("");
        return `<!doctype html><html lang="en"><head><meta charset="utf-8"><title>${title}</title><style>
          @page{size:landscape;margin:12mm}*{box-sizing:border-box}body{font:10pt/1.4 Arial,sans-serif;color:#111;margin:24px}h1{font-size:22pt;margin:0 0 4px}h2{font-size:14pt;margin:0 0 6px}h3{font-size:12pt}header{border-bottom:2px solid #222;margin-bottom:16px;padding-bottom:8px}.subtitle{color:#555}table{border-collapse:collapse;width:100%;margin:8px 0 14px}th,td{border:1px solid #888;padding:4px 6px;text-align:left;vertical-align:top}th{background:#eee}code{font-family:Consolas,monospace;white-space:nowrap}.meta{display:flex;flex-wrap:wrap;gap:4px 16px}.operation{white-space:pre-wrap}.document-intro,.description{white-space:pre-wrap;margin:6px 0}article{break-inside:avoid;border-bottom:1px solid #aaa;padding:8px 0}.toolbar{margin-bottom:16px}@media print{body{margin:0}.toolbar{display:none}}
          </style></head><body><div class="toolbar"><button onclick="window.print()">Print</button></div><header><h1>${title}</h1><div class="subtitle">${ctx.W === null ? "Word width unset" : `${ctx.W}-bit encoding reference`}</div></header>${intro}<h2>Instruction summary</h2><table><thead><tr><th>Mnemonic</th><th>Addressing mode</th><th>Bytes</th><th>Cycles</th><th>Flags</th><th>Decode pattern</th></tr></thead><tbody>${instructionRows}</tbody></table><h2>Instruction details</h2>${instructionDetails}<h2>Value lists</h2>${lists || "<p>No lists defined.</p>"}</body></html>`;
      }

      function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).catch(() => {});
          return;
        }
        const ta = el("textarea", { value: text });
        document.body.append(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
      }

      function saveProject() {
        const data = {
          format: "opcode-composer-project",
          version: 1,
          project: state,
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], {
          type: "application/json",
        });
        const url = URL.createObjectURL(blob);
        const link = el("a", { href: url, download: "opcode-project.json" });
        document.body.append(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      function loadProject(data) {
        const project = data.project;
        const object = (v) => v && typeof v === "object" && !Array.isArray(v);
        const strings = (v, keys) =>
          keys.every((key) => !Object.hasOwn(v, key) || typeof v[key] === "string");
        const isId = (v) => Number.isInteger(v) && v > 0;
        const ids = new Set();
        const addId = (id) => {
          if (!isId(id) || ids.has(id)) return false;
          ids.add(id);
          return true;
        };
        const valid =
          data.version === 1 && object(project) && project.version === 1 &&
          typeof project.wordWidth === "string" &&
          typeof project.docTitle === "string" && typeof project.docIntro === "string" &&
          isId(project.nextId) &&
          (project.selectedBlock === null || isId(project.selectedBlock)) &&
          (project.selectedMnemonic === null || isId(project.selectedMnemonic)) &&
          (!Object.hasOwn(project, "selectedEncodeMnemonic") ||
            project.selectedEncodeMnemonic === null || isId(project.selectedEncodeMnemonic)) &&
          Array.isArray(project.blocks) && Array.isArray(project.mnemonics) &&
          validMnemonicGroups(project.mnemonics) &&
          project.blocks.every((b) =>
            object(b) && addId(b.id) && typeof b.kind === "string" &&
            Object.hasOwn(KIND_LABEL, b.kind) &&
            validBlockConstraints(b) &&
            strings(b, ["name", "widthOverride", "width", "value"]) &&
            (!Object.hasOwn(b, "color") ||
              (typeof b.color === "string" && /^#[0-9a-f]{6}$/i.test(b.color))) &&
            (!Object.hasOwn(b, "numberMode") || NUMBER_MODES.includes(b.numberMode)) &&
            typeof b.name === "string" && typeof b.width === "string" &&
            typeof b.signed === "boolean" && Array.isArray(b.items) &&
            b.items.every((item) =>
              object(item) && addId(item.id) &&
              typeof item.name === "string" && typeof item.code === "string",
            ),
          ) &&
          project.mnemonics.every((m) =>
            object(m) && addId(m.id) && typeof m.name === "string" &&
            strings(m, ["addressing", "operation", "assemblyLine", "bytes", "cycles", "flags", "description"]) &&
            Array.isArray(m.slots) && Array.isArray(m.comparisons) &&
            m.slots.every((slot) =>
              object(slot) && addId(slot.id) && isId(slot.blockId) &&
              (slot.pin === null || isId(slot.pin)) &&
              strings(slot, ["label", "blockName", "pinName", "encValue"]),
            ) &&
            m.comparisons.every((variant) =>
              object(variant) && strings(variant, ["assemblyLine"]) &&
              object(variant.values) &&
              Object.entries(variant.values).every(([id, value]) =>
                isId(Number(id)) && typeof value === "string",
              ),
            ),
          );
        if (!valid) throw new Error("The file contains invalid project data.");
        const imported = sanitize(project);
        imported.nextId = Math.max(imported.nextId, project.nextId);
        if (!confirm("Replace the current workspace with this project? This cannot be undone."))
          return;
        state = imported;
        $("wordWidth").value = state.wordWidth;
        $("docTitle").value = state.docTitle;
        $("docIntro").value = state.docIntro;
        refresh();
      }

      function loadFile(raw) {
        const data = JSON.parse(raw);
        if (data?.format === "opcode-composer-project") loadProject(data);
        else if (data?.format === "opcode-composer-lists") loadLists(data);
        else if (data?.format === "opcode-composer-mnemonics") loadMnemonics(data);
        else throw new Error("This is not a supported opcode composer file.");
      }

      function loadLists(data) {
        if (
          !data ||
          data.format !== "opcode-composer-lists" ||
          data.version !== 1 ||
          !Array.isArray(data.blocks)
        )
          throw new Error("This is not a supported opcode lists file.");

        if (data.blocks.some((b) => b && !validBlockConstraints(b)))
          throw new Error("The file contains invalid block constraints.");
        const imported = sanitize({ blocks: data.blocks }).blocks;
        const ids = new Set();
        const valid =
          imported.length === data.blocks.length &&
          imported.every(
            (b, i) =>
              b.kind === "list" &&
              b.items.length ===
                (Array.isArray(data.blocks[i]?.items)
                  ? data.blocks[i].items.length
                  : 0),
          );
        for (const b of imported) {
          if (ids.has(b.id)) throw new Error("The file contains duplicate IDs.");
          ids.add(b.id);
          for (const item of b.items) {
            if (ids.has(item.id)) throw new Error("The file contains duplicate IDs.");
            ids.add(item.id);
          }
        }
        if (!valid) throw new Error("The file contains invalid list data.");
        if (!confirm("Replace all current lists with the lists in this file? List slots that refer to lists not in the file will be removed."))
          return;

        const currentLists = state.blocks.filter((b) => b.kind === "list");
        const currentListIds = new Set(currentLists.map((b) => b.id));
        const blockIdMap = new Map();
        const itemIdMaps = new Map();
        const replacements = imported.map((b) => {
          const oldBlockId = b.id;
          const oldItemIds = b.items.map((item) => item.id);
          const copy = {
            ...b,
            id: newId(),
            items: b.items.map((item) => ({ ...item, id: newId() })),
          };
          blockIdMap.set(oldBlockId, copy.id);
          itemIdMaps.set(
            oldBlockId,
            new Map(oldItemIds.map((id, i) => [id, copy.items[i].id])),
          );
          return copy;
        });

        const remapListValue = (value, itemIds) => {
          if (value === "") return value;
          const id = itemIds.get(Number(value));
          if (id === undefined)
            throw new Error("An encoded list value is missing from the imported lists.");
          return String(id);
        };
        const updatedMnemonics = state.mnemonics.map((mnemonic) => {
          const itemMapsBySlot = new Map();
          const slots = mnemonic.slots.flatMap((slot) => {
            if (!currentListIds.has(slot.blockId)) return [slot];
            const blockId = blockIdMap.get(slot.blockId);
            if (blockId === undefined) return [];
            const itemIds = itemIdMaps.get(slot.blockId);
            itemMapsBySlot.set(String(slot.id), itemIds);
            return [{
              ...slot,
              blockId,
              pin: slot.pin === null ? null : itemIds.get(slot.pin) ?? null,
              encValue: remapListValue(slot.encValue, itemIds),
            }];
          });
          const slotIds = new Set(slots.map((slot) => String(slot.id)));
          return {
            ...mnemonic,
            slots,
            comparisons: mnemonic.comparisons.map((variant) => ({
              ...variant,
              values: Object.fromEntries(
                Object.entries(variant.values)
                  .filter(([id]) => slotIds.has(id))
                  .map(([id, value]) => [
                    id,
                    itemMapsBySlot.has(id) ? remapListValue(value, itemMapsBySlot.get(id)) : value,
                  ]),
              ),
            })),
          };
        });
        state.mnemonics = updatedMnemonics;
        state.blocks = [
          ...state.blocks.filter((b) => b.kind !== "list"),
          ...replacements,
        ];
        if (currentListIds.has(state.selectedBlock))
          state.selectedBlock = blockIdMap.get(state.selectedBlock) ?? null;
        refresh();
      }

      function loadMnemonics(data) {
        if (!data || data.format !== "opcode-composer-mnemonics" || !Array.isArray(data.mnemonics))
          throw new Error("This is not a supported mnemonic file.");
        if (data.version !== 1 && data.version !== 2)
          throw new Error("This mnemonic file version is not supported.");
        for (const key of ["docTitle", "docIntro"])
          if (Object.hasOwn(data, key) && typeof data[key] !== "string")
            throw new Error(`The file contains an invalid ${key}.`);
        if (!validMnemonicGroups(data.mnemonics))
          throw new Error("The file contains invalid mnemonic forms or shared fields.");
        if (Array.isArray(data.blocks) && data.blocks.some((b) =>
          b && Object.hasOwn(b, "numberMode") && !NUMBER_MODES.includes(b.numberMode)))
          throw new Error("The file contains an invalid number mode.");
        if (Array.isArray(data.blocks) && data.blocks.some((b) => b && !validBlockConstraints(b)))
          throw new Error("The file contains invalid block constraints.");

        const imported = sanitize({ blocks: data.blocks || [], mnemonics: data.mnemonics });
        const valid =
          imported.mnemonics.length === data.mnemonics.length &&
          imported.mnemonics.every((m, i) =>
            m.slots.length === (Array.isArray(data.mnemonics[i]?.slots) ? data.mnemonics[i].slots.length : 0) &&
            m.comparisons.length === (Array.isArray(data.mnemonics[i]?.comparisons) ? data.mnemonics[i].comparisons.length : 0),
          );
        if (!valid) throw new Error("The file contains invalid mnemonic data.");

        const sourceIds = new Set();
        const addSourceId = (id) => {
          if (!Number.isInteger(id) || id <= 0 || sourceIds.has(id))
            throw new Error("The file contains missing or duplicate IDs.");
          sourceIds.add(id);
        };
        for (const b of imported.blocks) {
          addSourceId(b.id);
          for (const item of b.items) addSourceId(item.id);
        }
        for (const m of imported.mnemonics) {
          addSourceId(m.id);
          for (const slot of m.slots) addSourceId(slot.id);
          const slotIds = new Set(m.slots.map((slot) => slot.id));
          for (const variant of m.comparisons)
            for (const id of Object.keys(variant.values || {}))
              if (!slotIds.has(Number(id)))
                throw new Error(`Mnemonic "${m.name}" has a comparison for a missing slot.`);
        }

        const importedById = new Map(imported.blocks.map((b) => [b.id, b]));
        const addedBlocks = new Map(); // source block ID -> new block ID
        const missingBlocks = new Map(); // normalized block name -> new block ID
        const missingDefinitions = new Set();
        const conflictingDefinitions = new Set();
        const addBlockCopy = (source, sourceName) => {
          const existing = source?.generatedPadding
            ? null : blockByName(source?.name || sourceName);
          if (existing) {
            if (source && (
              source.kind !== existing.kind ||
              (source.kind !== "list" && source.width !== existing.width) ||
              (source.kind === "number" && source.numberMode !== existing.numberMode) ||
              source.startBit !== existing.startBit ||
              source.required !== existing.required ||
              (source.kind === "const" && source.value !== existing.value)
            )) conflictingDefinitions.add(existing.name);
            return existing.id;
          }
          if (source && addedBlocks.has(source.id)) return addedBlocks.get(source.id);
          const missingName = normalizeName(sourceName);
          if (!source && missingBlocks.has(missingName)) return missingBlocks.get(missingName);
          if (!source) missingDefinitions.add(sourceName);
          const copy = {
            id: newId(),
            kind: source?.kind || "number",
            name: source?.name || sourceName || "Imported block",
            items: source?.items.map((item) => ({ ...item, id: newId() })) || [],
            widthOverride: source?.widthOverride || "",
            width: source?.width ?? "16",
            startBit: source?.startBit ?? "",
            required: source?.required === true,
            generatedPadding: source?.generatedPadding === true,
            signed: source?.signed === true,
            numberMode: source?.numberMode ?? "unsigned",
            value: source?.value || "",
            color: source?.color || "",
          };
          state.blocks.push(copy);
          if (source) addedBlocks.set(source.id, copy.id);
          else missingBlocks.set(missingName, copy.id);
          return copy.id;
        };

        const slotIdMap = new Map();
        const listValuesBySlot = new Map();
        const groupIdMap = new Map();
        for (const m of imported.mnemonics) {
          const groupId = mnemonicGroupId(m);
          if (!groupIdMap.has(groupId)) groupIdMap.set(groupId, newId());
        }
        for (const m of imported.mnemonics)
          for (const slot of m.slots) slotIdMap.set(slot.id, newId());
        const addedMnemonics = imported.mnemonics.map((m) => ({
          ...m,
          id: newId(),
          groupId: groupIdMap.get(mnemonicGroupId(m)),
          slots: m.slots.map((slot) => {
            const source = importedById.get(slot.blockId);
            if (!source && !slot.blockName)
              throw new Error(`Mnemonic "${m.name}" has a slot without a block.`);
            const blockId = addBlockCopy(source, slot.blockName);
            const target = blockById(blockId);
            const remapValue = (value) => {
              if (value === "" || target.kind !== "list") return value;
              const sourceItem = source?.items.find((item) => String(item.id) === value);
              const item = source
                ? sourceItem && itemByName(target, sourceItem.name)
                : target.items.find((entry) => String(entry.id) === value);
              if (!item)
                throw new Error(`Mnemonic "${m.name}" refers to an encoded item that is not in list "${target.name}".`);
              return String(item.id);
            };
            listValuesBySlot.set(String(slot.id), remapValue);
            let pin = null;
            if (slot.pin !== null || slot.pinName) {
              const sourceItem = source?.items.find((item) => item.id === slot.pin);
              const item = itemByName(target, slot.pinName || sourceItem?.name);
              if (!item)
                throw new Error(`Mnemonic "${m.name}" refers to a pinned item that is not in list "${target.name}".`);
              pin = item.id;
            }
            return {
              ...slot,
              id: slotIdMap.get(slot.id),
              blockId,
              blockName: target.name,
              pin,
              pinName: pin === null ? "" : itemNameById(target, pin),
              encValue: remapValue(slot.encValue),
            };
          }),
          comparisons: m.comparisons.map((variant) => ({
            ...variant,
            values: Object.fromEntries(
              Object.entries(variant.values || {}).map(([id, value]) => [
                slotIdMap.get(Number(id)),
                listValuesBySlot.get(id)(value),
              ]),
            ),
          })),
        }));

        state.mnemonics = addedMnemonics;
        pruneGeneratedPadding();
        state.selectedMnemonic = addedMnemonics[0]?.id ?? null;
        state.selectedEncodeMnemonic = addedMnemonics[0]?.id ?? null;
        if (Object.hasOwn(data, "docTitle")) {
          state.docTitle = data.docTitle;
          $("docTitle").value = state.docTitle;
        }
        if (Object.hasOwn(data, "docIntro")) {
          state.docIntro = data.docIntro;
          $("docIntro").value = state.docIntro;
        }
        refresh();
        const notices = [];
        if (missingDefinitions.size)
          notices.push(`Missing block definitions were created as unsigned 16-bit numbers: ${[...missingDefinitions].join(", ")}. Check their type and width.`);
        if (conflictingDefinitions.size)
          notices.push(`Existing block definitions were kept instead of the imported definitions: ${[...conflictingDefinitions].join(", ")}. Check their type and width.`);
        if (notices.length) alert(notices.join("\n\n"));
      }

      // ---------- Wiring ----------

      const palette = $("palette");
      $("paddingTemplate").addEventListener("dragstart", (e) =>
        startDrag(e, { type: "padding" }, "copy"),
      );
      $("paddingTemplate").addEventListener("dragend", endDrag);
      $("insertPadding").addEventListener("click", () => {
        const m = currentMnemonic();
        if (m) addPaddingSlot(m, m.slots.length);
      });
      const paletteDropIndex = (e) => {
        const rows = [...palette.querySelectorAll("li.block")];
        const index = rows.findIndex((row) => {
          const rect = row.getBoundingClientRect();
          return e.clientY < rect.top + rect.height / 2;
        });
        return index < 0 ? rows.length : index;
      };
      palette.addEventListener("dragover", (e) => {
        if (!dragData || dragData.type !== "block") return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        clearDropMarks();
        const target = palette.querySelectorAll("li.block")[paletteDropIndex(e)];
        if (target) target.classList.add("drop-before");
        else palette.classList.add("drop-end");
      });
      palette.addEventListener("dragleave", (e) => {
        if (!palette.contains(e.relatedTarget)) clearDropMarks();
      });
      palette.addEventListener("drop", (e) => {
        if (!dragData || dragData.type !== "block") return;
        e.preventDefault();
        const id = dragData.id;
        const index = paletteDropIndex(e);
        endDrag();
        moveBlockTo(id, index);
      });

      $("wordWidth").value = state.wordWidth;
      $("docTitle").value = state.docTitle;
      $("docTitle").addEventListener("input", (e) => {
        state.docTitle = e.target.value;
        save();
      });
      $("docIntro").value = state.docIntro;
      $("docIntro").addEventListener("input", (e) => {
        state.docIntro = e.target.value;
        save();
      });
      $("wordWidth").addEventListener("input", (e) => {
        state.wordWidth = e.target.value;
        refresh();
      });
      $("addList").addEventListener("click", () => addBlock("list"));
      $("addNumber").addEventListener("click", () => addBlock("number"));
      $("addConst").addEventListener("click", () => addBlock("const"));
      $("saveProject").addEventListener("click", saveProject);
      $("loadProject").addEventListener("click", () => $("projectFile").click());
      $("projectFile").addEventListener("change", async (e) => {
        const file = e.target.files[0];
        e.target.value = "";
        if (!file) return;
        try {
          loadFile(await file.text());
        } catch (error) {
          alert(`Could not load file: ${error.message}`);
        }
      });
      $("addMnemonic").addEventListener("click", addMnemonic);
      $("decInput").addEventListener("input", () => renderDecode(computeAll()));
      $("exportMd").addEventListener("click", () => {
        $("mdOutput").value = generateMarkdown(computeAll());
      });
      $("copyMd").addEventListener("click", () =>
        copyText($("mdOutput").value),
      );
      $("printDocs").addEventListener("click", () => {
        const preview = window.open("", "_blank");
        if (!preview) {
          alert("Allow pop-ups to preview and print the documentation.");
          return;
        }
        preview.document.open();
        preview.document.write(generatePrintHtml(computeAll()));
        preview.document.close();
      });
      $("resetAll").addEventListener("click", () => {
        if (!confirm("Delete all blocks and mnemonics? This cannot be undone."))
          return;
        state = defaultState();
        $("wordWidth").value = state.wordWidth;
        $("docTitle").value = state.docTitle;
        $("docIntro").value = state.docIntro;
        refresh();
      });

      refresh();
      if (loadMessage) alert(loadMessage);
    </script>
  </body>
</html>
